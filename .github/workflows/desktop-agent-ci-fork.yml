# 外部 fork PR 的 desktop agent CI — 維護者核准制。
#
# 流程：
# 1. fork PR 開啟／更新時，desktop-agent-ci.yml 的 combined-agent 會 skip，
#    fork-notice 寫 job summary 說明需要維護者核准。
# 2. 維護者逐行 review PR 後加上 `run-desktop-ci` label → 本 workflow 以
#    pull_request_target 觸發，build「加 label 當下」的 head SHA（payload 內的
#    pull_request.head.sha，不跟著之後的 push 走），並把結果以 commit status
#    `desktop-agent-ci (maintainer-approved)` 回報到該 SHA。
# 3. PR 之後只要有新 push（synchronize），自動移除 label — 新 commit 必須重新
#    review、重新加 label（避免 review 與執行之間被偷換程式碼的 TOCTOU）。
#
# pull_request_target 安全守則：
# - 本檔與 desktop-agent-build.yml、overlay action 都從 base（main）讀取；
#   PR 內對這些檔案的修改在這條路徑上不生效。
# - label gate 之前不 checkout、不執行任何 PR 程式碼。
# - 所有 job 的 GITHUB_TOKEN 權限最小化；有寫入權限的 job（移除 label、
#   回報 status）完全不 checkout PR 程式碼。build job 只有 contents: read。
# 殘餘風險見 desktop-agent-build.yml 開頭與 CONTRIBUTING.md。
name: desktop-agent-ci-fork

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]
    branches:
      - main

permissions: {}

jobs:
  # 新 commit 進來 → 撤銷核准。只呼叫 GitHub API，不碰 PR 程式碼。
  revoke-approval:
    if: >-
      github.event.action != 'labeled' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-desktop-ci')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove run-desktop-ci label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/run-desktop-ci" --silent || true
          {
            echo "## run-desktop-ci label 已移除"
            echo
            echo "PR 有新 commit（\`$HEAD_SHA\`），維護者須重新 review 後再加 \`run-desktop-ci\` label。"
            echo
            echo "**English:** New commits were pushed; a maintainer must re-review and re-apply the \`run-desktop-ci\` label."
          } >> "$GITHUB_STEP_SUMMARY"

  approved:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-desktop-ci' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    outputs:
      head-sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Pin head SHA at approval time
        id: pin
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid head sha '$HEAD_SHA'" >&2
            exit 1
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Approved by @$SENDER for \`$HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Report pending status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pin.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state=pending \
            -f context="desktop-agent-ci (maintainer-approved)" \
            -f description="maintainer-approved desktop CI running" \
            -f target_url="$RUN_URL" --silent

  combined-agent:
    needs: approved
    concurrency:
      group: desktop-agent-ci-fork-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-agent-build.yml
    with:
      checkout-ref: ${{ needs.approved.outputs.head-sha }}
      untrusted: true
    secrets:
      AGENT_SSH_KEY: ${{ secrets.AGENT_SSH_KEY }}

  # 把結果掛到 PR head SHA 上（pull_request_target 的 check run 掛在 base
  # commit，這個 status 讓結果跟著被核准的那個 commit）。不碰 PR 程式碼。
  report:
    needs: [approved, combined-agent]
    if: always() && needs.approved.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.approved.outputs.head-sha }}
          RESULT: ${{ needs.combined-agent.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            success) STATE=success; DESC="maintainer-approved desktop CI passed" ;;
            cancelled) STATE=error; DESC="desktop CI cancelled; re-apply run-desktop-ci" ;;
            *) STATE=failure; DESC="maintainer-approved desktop CI $RESULT" ;;
          esac
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="desktop-agent-ci (maintainer-approved)" \
            -f description="$DESC" \
            -f target_url="$RUN_URL" --silent
          echo "Reported \`$STATE\` on \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
